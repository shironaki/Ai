name: Python integrity check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile all Python sources
        run: python -m compileall -q .

      - name: Import application
        env:
          BOT_TOKEN: "000000000:TEST_TOKEN_FOR_CI_ONLY"
          PYTHONUNBUFFERED: "1"
        run: python -c "import main; print('Application import OK; handlers:', len(main.dp.message_handlers.handlers))"

      - name: Check AI service without credentials
        run: python -c "from services.ai_service import ai_status; print(ai_status()); assert ai_status()['configured'] is False"

      - name: Run runtime regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
