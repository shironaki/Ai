name: Heart

# Запасной путь, только по кнопке. Сам этот файл ничего не запускает: ни на
# коммит, ни по расписанию — минуты Actions не тратятся.
#
# Основной путь — второй телефон: `scripts/phone.sh` следит за веткой, сам
# публикует новую сборку и раз в минуту будит сердце (docs/PHONE.md). Так
# решил владелец 12.11.2026: «без Actions, там лимиты, нам надо своё».
#
# Кнопка остаётся на случай, когда телефона под рукой нет:
#   smoke  — тесты и репетиция обработчиков в облаке, без отправки;
#   deploy — то же и публикация, с любой ветки;
#   tick   — разбудить сердце один раз.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke — проверка без отправки; deploy — публикация; tick — разбудить сердце"
        type: choice
        required: true
        default: smoke
        options: [smoke, deploy, tick]

permissions:
  contents: read

jobs:
  tests:
    name: Local checks
    if: ${{ inputs.mode != 'tick' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run ci

  smoke:
    name: Handler runs without sending
    if: ${{ inputs.mode == 'smoke' }}
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # В облако код уходит без комментариев: инструмент шлёт его весь одним
      # запросом, а слишком тяжёлый запрос облако обрывает (17.11.2026). Копия
      # здесь одноразовая, поэтому правится на месте. То же делает телефон.
      - name: Strip comments from the code that goes to the cloud
        run: node scripts/slim.mjs --here
      - name: Run /start in a no-side-effects context
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_HEART_TOKEN }}
        run: |
          if [ -z "$TGCLOUD_TOKEN" ]; then
            echo "::error::Add the heart Serverless CLI token as secret TGCLOUD_HEART_TOKEN."; exit 1
          fi
          npx --yes @tgcloud/cli@0.2.0 run handlers/message '{ chat: { id: 1, type: "private" }, from: { id: 1 }, text: "/start" }' --ctx '{ testRun: true }'
      - name: Run a channel post in a no-side-effects context
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_HEART_TOKEN }}
        run: |
          npx --yes @tgcloud/cli@0.2.0 run handlers/channel_post '{ chat: { id: -1, type: "channel" }, text: "tick" }' --ctx '{ testRun: true }'
      - name: Run a button press in a no-side-effects context
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_HEART_TOKEN }}
        run: |
          npx --yes @tgcloud/cli@0.2.0 run handlers/callback_query '{ id: "1", from: { id: 1 }, data: "noop" }' --ctx '{ testRun: true }'
      # Функция комнаты: её зовёт страница мини-приложения (miniapp/). В репетиции она ничего не читает и не пишет.
      - name: Run the room endpoint in a no-side-effects context
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_HEART_TOKEN }}
        run: |
          npx --yes @tgcloud/cli@0.2.0 run endpoints/room '{ do: "look" }' --ctx '{ testRun: true }'
      - name: Inspect deployed state (read-only)
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_HEART_TOKEN }}
        run: npx --yes @tgcloud/cli@0.2.0 fetch

  deploy:
    name: Publish the heart
    # Сначала тесты, затем репетиция в облаке: если что-то из этого падает,
    # живой бот остаётся на прежней сборке. Те же шаги в том же порядке делает
    # телефон — `scripts/phone.sh`.
    if: ${{ inputs.mode == 'deploy' }}
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: heart-serverless
    # Две публикации подряд идут по очереди, а не наперегонки.
    concurrency:
      group: heart-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify token
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_HEART_TOKEN }}
        run: |
          if [ -z "$TGCLOUD_TOKEN" ]; then
            echo "::error::Add the heart Serverless CLI token as secret TGCLOUD_HEART_TOKEN."; exit 1
          fi
      # В облако код уходит без комментариев: инструмент шлёт его весь одним
      # запросом, а слишком тяжёлый запрос облако обрывает (17.11.2026). Копия
      # здесь одноразовая, поэтому правится на месте. То же делает телефон.
      - name: Strip comments from the code that goes to the cloud
        run: node scripts/slim.mjs --here
      # The provider key travels into the deployed module: this platform has no
      # environment variables. The owner's ID is a fallback for config.js, and
      # AI_EXTRA_KEYS ({"name":"key"} for spare providers) is optional.
      - name: Inject the provider key and the owner ID for this publish only
        env:
          AI_PROVIDER_KEY: ${{ secrets.AI_PROVIDER_KEY }}
          OWNER_TG_ID: ${{ secrets.OWNER_TG_ID }}
          AI_EXTRA_KEYS: ${{ secrets.AI_EXTRA_KEYS }}
        run: node scripts/inject-secrets.mjs --require-key
      # Репетиция в облаке до публикации: если код там не собирается или
      # обработчик падает, живой бот остаётся на прежней сборке.
      - name: Rehearse in the cloud before publishing
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_HEART_TOKEN }}
        run: |
          npx --yes @tgcloud/cli@0.2.0 run handlers/message '{ chat: { id: 1, type: "private" }, from: { id: 1 }, text: "/start" }' --ctx '{ testRun: true }'
          npx --yes @tgcloud/cli@0.2.0 run handlers/channel_post '{ chat: { id: -1, type: "channel" }, text: "tick" }' --ctx '{ testRun: true }'
          npx --yes @tgcloud/cli@0.2.0 run handlers/callback_query '{ id: "1", from: { id: 1 }, data: "noop" }' --ctx '{ testRun: true }'
      # Мини-приложение «Комната» — надстройка над ботом: что бы с ним ни вышло,
      # сам бот публикуется, а комната отвечает словами. Поэтому репетиция функции
      # комнаты мягкая: отказ — предупреждение, а не остановка.
      - name: Rehearse the room endpoint (a refusal does not stop the publish)
        id: room
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_HEART_TOKEN }}
        run: |
          set +e
          if npx --yes @tgcloud/cli@0.2.0 run endpoints/room '{ do: "look" }' --ctx '{ testRun: true }'; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The room endpoint did not pass the rehearsal: the bot is published without the Mini App."
            echo "- мини-приложение «Комната»: функция комнаты не прошла репетицию — комната отвечает словами" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - name: Re-check deployed state
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_HEART_TOKEN }}
        run: npx --yes @tgcloud/cli@0.2.0 fetch
      # `endpoints` — функция комнаты. Не приняла платформа код вместе с ней —
      # бот важнее: он уходит без неё.
      - name: Publish
        id: publish
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_HEART_TOKEN }}
          ROOM_OK: ${{ steps.room.outputs.ok }}
        run: |
          if [ "$ROOM_OK" = "1" ]; then
            if npx --yes @tgcloud/cli@0.2.0 push handlers lib schema endpoints; then
              echo "room=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::The platform refused the code together with the room endpoint — publishing without it."
            echo "- мини-приложение «Комната»: платформа не приняла функцию комнаты — комната отвечает словами" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Без комнаты — значит, и без её функции в копии: инструмент проверяет
          # все модули папки, а не только отправляемые.
          rm -rf tgcloud/endpoints
          npx --yes @tgcloud/cli@0.2.0 push handlers lib schema
      # Publishing a schema is not applying it. Without this step the heart ran
      # against a database with no tables: reads returned null, writes failed,
      # and «запомни, …» answered «хранилище не отвечает» while /status said the
      # storage was available. The tables exist only after migrate.
      - name: Apply database schema
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_HEART_TOKEN }}
        run: npx --yes @tgcloud/cli@0.2.0 migrate --yes
      # Посты канала — отдельный вид обновлений. Платформа сама обновляет
      # список при публикации; здесь он проверяется и, если разошёлся, чинится.
      - name: Check the webhook
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_HEART_TOKEN }}
        run: |
          set +e
          npx --yes @tgcloud/cli@0.2.0 webhook > webhook.txt 2>&1
          grep -v -i "url" webhook.txt
          if grep -q "OUT OF SYNC" webhook.txt; then
            echo "::warning::The webhook did not match the handlers — syncing."
            npx --yes @tgcloud/cli@0.2.0 webhook sync > webhook.txt 2>&1
            grep -v -i "url" webhook.txt
          fi
          {
            echo "### Сердце опубликовано"
            echo ""
            echo "- коммит: \`${GITHUB_SHA::7}\`"
            grep -i "allowed updates" webhook.txt | head -1 | sed 's/^ */- /'
            if grep -q "OUT OF SYNC" webhook.txt; then echo "- вебхук: **не совпал с обработчиками** — посты канала могут не доходить"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f webhook.txt
          exit 0
      # Страница комнаты (папка miniapp/, см. tgcloud.jsonc) — отдельной отправкой
      # и после кода: её неудача бота не трогает. Адрес страницы называет
      # платформа; инструмент кладёт её ответ в .tgcloud/static.json. В адрес
      # попадают только безопасные знаки: он уходит сердцу внутри строки настроек.
      - name: Publish the room page (a refusal does not stop the publish)
        id: page
        if: ${{ steps.publish.outputs.room == '1' }}
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_HEART_TOKEN }}
        run: |
          set +e
          npx --yes @tgcloud/cli@0.2.0 push miniapp
          pushed=$?
          url=$(node -e 'try { const url = JSON.parse(require("node:fs").readFileSync(".tgcloud/static.json", "utf8")).url; if (typeof url === "string" && url.length <= 200 && /^https:\/\/[A-Za-z0-9._~:\/-]+$/.test(url)) console.log(url); } catch { /* адреса нет */ }')
          if [ -n "$url" ]; then echo "url=$url" >> "$GITHUB_OUTPUT"; fi
          if [ "$pushed" -ne 0 ]; then
            rest="комната отвечает словами"
            if [ -n "$url" ]; then rest="кнопки открывают прежнюю страницу"; fi
            echo "::warning::The room page was not published. The bot itself is on the new build."
            echo "- мини-приложение «Комната»: страница не опубликована — $rest" >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$url" ]; then
            echo "::warning::The platform accepted the room page but did not name its address."
            echo "- мини-приложение «Комната»: платформа не назвала адрес страницы — комната отвечает словами" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- мини-приложение «Комната»: страница опубликована" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      # Опубликованный код просыпается только от сообщения. Этот шаг будит его
      # сразу: сердце само пишет владельцу «я обновилась» с самопроверкой — и
      # не нужно спрашивать /status, чтобы узнать, доехал ли код. Вместе с
      # пробуждением сердце узнаёт адрес страницы комнаты: по нему ставятся кнопки.
      - name: Wake the heart on the new build
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_HEART_TOKEN }}
          PAGE_URL: ${{ steps.page.outputs.url }}
        run: |
          set +e
          if [ -n "$PAGE_URL" ]; then
            out=$(npx --yes @tgcloud/cli@0.2.0 run handlers/message '{}' --ctx "{ tick: true, deployed: true, page: \"$PAGE_URL\" }" 2>&1)
          else
            out=$(npx --yes @tgcloud/cli@0.2.0 run handlers/message '{}' --ctx '{ tick: true, deployed: true }' 2>&1)
          fi
          echo "$out"
          build=$(node -e 'const found = require("node:fs").readFileSync("tgcloud/lib/heart.js", "utf8").match(/export const BUILD = "([^"]+)"/u); console.log(found ? found[1] : "?")')
          if echo "$out" | grep -Eq "ok: ?true"; then
            echo "- сборка \`$build\`: сердце проснулось; о новой сборке оно пишет владельцу само" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- сборка \`$build\`: пробуждение не подтвердилось — проверьте \`/status\` в боте" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::The post-publish wake-up did not confirm. The code is published; check /status in the bot."
          fi
          exit 0
      - name: Restore the empty secret slots
        if: always()
        run: git checkout -- tgcloud/lib/secrets.js

  alarm:
    name: Wake the heart
    if: ${{ inputs.mode == 'tick' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # То же окружение, что у публикации: ключи могут лежать в нём, а без них
    # разбуженное сердце решило бы, что думать нечем.
    environment: heart-serverless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # В облако код уходит без комментариев: инструмент шлёт его весь одним
      # запросом, а слишком тяжёлый запрос облако обрывает (17.11.2026). Копия
      # здесь одноразовая, поэтому правится на месте. То же делает телефон.
      - name: Strip comments from the code that goes to the cloud
        run: node scripts/slim.mjs --here
      # Такой запуск исполняет код из этой копии, поэтому ему нужны те же
      # ключи, что и публикации. Нет ключа — сердце проснётся, напомнит и
      # досчитает, но отложенные ответы подождут.
      - name: Fill the secret slots for this run only
        env:
          AI_PROVIDER_KEY: ${{ secrets.AI_PROVIDER_KEY }}
          OWNER_TG_ID: ${{ secrets.OWNER_TG_ID }}
          AI_EXTRA_KEYS: ${{ secrets.AI_EXTRA_KEYS }}
        run: node scripts/inject-secrets.mjs
      - name: Tick
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_HEART_TOKEN }}
        run: |
          if [ -z "$TGCLOUD_TOKEN" ]; then
            echo "::error::Add the heart Serverless CLI token as secret TGCLOUD_HEART_TOKEN."; exit 1
          fi
          set +e
          out=$(npx --yes @tgcloud/cli@0.2.0 run handlers/message '{}' --ctx '{ tick: true }' 2>&1)
          code=$?
          echo "$out"
          if echo "$out" | grep -q "build_mismatch"; then
            echo "::warning::This checkout and the published build differ: the tick touched nothing. Publish first (Heart → deploy)."
            exit 0
          fi
          exit $code
      - name: Restore the empty secret slots
        if: always()
        run: git checkout -- tgcloud/lib/secrets.js
